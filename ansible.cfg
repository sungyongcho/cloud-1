[defaults]

inventory = inventory.yml

host_key_checking = False

deprecation_warnings = False

# Example ad-hoc inventory entries for local testing.
# Keep real host IPs and private key paths out of this file before publishing.

[vagrant]
vagrant ansible_host=192.168.56.10 ansible_user=vagrant private_key_file=./vagrant/.vagrant/machines/default/virtualbox/private_key
[cloud-1]
cloud-1 ansible_host=<remote_host_ip> ansible_user=<remote_user> ansible_ssh_private_key_file=<path_to_private_key>
